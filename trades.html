<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sleeper League Trades</title>
    <style>
        :root {
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #cbd5e1;
            --border-light: #e2e8f0;
            --border-dark: #475569;
            --subtle-bg: #f1f5f9;
            --btn-primary: #334155;
            --btn-primary-hover: #1e293b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: var(--bg);
            color: var(--text-main);
            margin: 0;
            padding: 0 0 60px;
            line-height: 1.5;
        }

        .navbar {
            background: #ffffff;
            border-bottom: 1px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            margin-bottom: 24px;
        }

        .navbar-brand {
            font-weight: 700;
            font-size: 0.95rem;
            color: var(--text-main);
            text-decoration: none;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            padding: 6px 14px;
            border: 1px solid var(--border-light);
            border-radius: 2px;
            font-weight: 600;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            background: #ffffff;
            transition: all 0.15s ease;
        }

        .nav-link:hover {
            color: var(--text-main);
            border-color: var(--border-dark);
            background: var(--subtle-bg);
        }

        .nav-link.active {
            background: var(--btn-primary);
            color: #ffffff;
            border-color: var(--btn-primary);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 20px;
        }

        h1 {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.01em;
            margin-bottom: 20px;
        }

        #input-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        input,
        select {
            padding: 9px 12px;
            font-size: 0.9rem;
            border: 1px solid var(--border);
            border-radius: 2px;
            background: #ffffff;
            color: var(--text-main);
            outline: none;
            font-family: inherit;
        }

        input:focus,
        select:focus {
            border-color: var(--border-dark);
        }

        #leagueId {
            min-width: 280px;
        }

        button {
            background: var(--btn-primary);
            color: #ffffff;
            border: 1px solid var(--btn-primary);
            border-radius: 2px;
            padding: 9px 18px;
            font-size: 0.82rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            cursor: pointer;
            transition: background 0.15s ease;
        }

        button:hover {
            background: var(--btn-primary-hover);
            border-color: var(--btn-primary-hover);
        }

        #results {
            max-width: 900px;
            margin: 0 auto;
        }

        .trade-card {
            background: var(--card-bg);
            padding: 16px 18px;
            border: 1px solid var(--border);
            border-radius: 2px;
            margin-bottom: 14px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.02);
        }

        .trade-card h3 {
            margin: 0 0 10px;
            font-size: 1rem;
            font-weight: 700;
            color: var(--text-main);
            border-bottom: 1px solid var(--border-light);
            padding-bottom: 6px;
        }

        .trade-entry {
            margin: 8px 0;
            padding-left: 12px;
            border-left: 3px solid var(--btn-primary);
        }

        .trade-entry strong {
            font-size: 0.92rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .trade-entry ul {
            margin-top: 4px;
            padding-left: 18px;
            font-size: 0.88rem;
            color: var(--text-main);
        }

        .trade-entry li {
            margin: 2px 0;
        }

        .toggle-json {
            margin-top: 8px;
            background: none;
            border: 1px solid var(--border-light);
            border-radius: 2px;
            color: var(--text-muted);
            font-size: 0.7rem;
            font-family: monospace;
            padding: 3px 6px;
        }

        .toggle-json:hover {
            color: var(--text-main);
            border-color: var(--border-dark);
            background: none;
        }

        pre {
            background: #1e293b;
            color: #f8fafc;
            padding: 10px;
            border-radius: 2px;
            overflow: auto;
            font-family: monospace;
            font-size: 0.78rem;
            margin-top: 8px;
        }

        #filters-container {
            display: none;
            justify-content: center;
            gap: 8px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }
    </style>
</head>

<body>
    <header class="navbar">
        <a href="index.html" class="navbar-brand">Sleeper Tools</a>
        <nav class="nav-links">
            <a href="index.html" class="nav-link">Home</a>
            <a href="trades.html" class="nav-link active">Trades</a>
            <a href="waivers.html" class="nav-link">Waivers & FA</a>
        </nav>
    </header>

    <div class="container">
        <h1>Sleeper League Trades</h1>

        <div id="input-container">
            <input id="leagueId" type="text" placeholder="Enter Sleeper League ID" />
            <button onclick="loadTrades()">Load Trades</button>
        </div>

        <div id="filters-container">
            <select id="seasonSelect">
                <option value="">All Seasons</option>
            </select>
            <select id="ownerSelect">
                <option value="">All Owners</option>
            </select>
        </div>

        <div id="results"></div>
    </div>

    <script src="players.js"></script>
    <script src="trades.js"></script>
</body>

</html>
